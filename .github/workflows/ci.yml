name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: ['**']

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint frontend
        run: npm run lint:frontend

      - name: Test frontend
        run: npm run test:frontend

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browser
        # playwright is a pinned Python dependency (used by pdf_service to
        # render PDFs), but pip installing it does not download a browser
        # binary - without this, every PDF-generating test fails with
        # "Executable doesn't exist at .../chromium.../chrome".
        run: python -m playwright install chromium

      - name: Lint backend
        run: npm run lint:backend:local || flake8 backend

      - name: Test backend
        run: cd backend && pytest
